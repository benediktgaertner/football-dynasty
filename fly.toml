# Fly.io-Konfiguration für den autoritativen Match-Server (siehe docs/DEPLOYMENT.md)
# App-Namen beim ersten `fly launch --no-deploy` anpassen.
app = "football-dynasty-match"
primary_region = "fra"

[build]
  dockerfile = "apps/match-server/Dockerfile"

[env]
  PORT = "2567"

# SIGTERM bei Deploy/Neustart: der Server sichert alle laufenden Partien (Checkpoint) und schließt die Verbindungen.
# Fly-Standard sind nur 5 s – zu knapp bei langsamer Datenbank, dann ginge bis zu 20 s Spielstand verloren.
kill_signal = "SIGTERM"
kill_timeout = "20s"

[http_service]
  internal_port = 2567
  force_https = true
  # Eine laufende Partie lebt im Speicher dieser Maschine. Deshalb genau eine Maschine,
  # die nicht automatisch gestoppt wird, solange Spieler verbunden sind.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
