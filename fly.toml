# fly.toml app configuration file generated for football-dynasty on 2026-11-18T15:04:38Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'football-dynasty'
primary_region = 'fra'

[build]
  dockerfile = 'apps/match-server/Dockerfile'

[env]
  PORT = '2567'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
